<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICN — پنل کارگردان</title>
<style>
:root{--bg:#080d16;--panel:#101827;--line:#26344e;--text:#eef4ff;--muted:#91a1bb;--ok:#3ad18d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172449 0,#080d16 40%);color:var(--text);font-family:Tahoma,Arial,sans-serif}
.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px}.login{max-width:460px;margin:8vh auto;padding:28px;background:#101827;border:1px solid var(--line);border-radius:24px}
.logo{font-size:22px;font-weight:900}.muted{color:var(--muted);line-height:1.9}label{display:block;margin:15px 0 7px;color:#bec9db}
input,textarea{width:100%;padding:13px;background:#0a1220;color:#fff;border:1px solid var(--line);border-radius:12px}
button,.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#fff;color:#08101e}.ghost{background:#18243a;color:#e4ecfa;border:1px solid #2c3b59}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.badge{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:99px;background:#10271d;color:#94efbd;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;margin-top:18px}aside{background:#101827;border:1px solid var(--line);border-radius:20px;padding:14px;height:max-content}
.nav button{width:100%;display:block;text-align:right;background:transparent;color:#bbc7da;padding:11px;border-radius:11px;margin:4px 0}.nav button.active{background:#1b2942;color:#fff}
.card{background:#101827;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}h1,h2,h3{margin-top:0}p,li{line-height:1.95}.feed{display:grid;gap:9px}.feeditem{background:#111c2e;border:1px solid #22314c;border-radius:14px;padding:12px}.feeditem small{display:block;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.errorcard{padding:14px;border:1px solid #33415d;border-radius:14px;margin:9px 0;background:#0d1625}.errorcard small{color:#92a1b9}
.chatbox{height:320px;overflow:auto;background:#09111e;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}.msg{max-width:84%;padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.8}.me{background:#263757;margin-right:auto}.agent{background:#15251f;border:1px solid #214c37}.chatrow{display:grid;grid-template-columns:1fr auto;gap:8px}.notice{padding:11px;border:1px dashed #35445f;border-radius:12px;color:#9ba9be;font-size:12px;margin-top:10px}.err{color:#ff8d8d;margin-top:10px}
@media(max-width:800px){.layout,.two{grid-template-columns:1fr}}
</style></head>
<body>
<section id="loginBox" class="login">
<div class="logo">ICN — ورود کارگردان</div>
<p class="muted">نسخه نمایشی GitHub Pages. هر حساب فقط پرونده فیلم خودش را باز می‌کند.</p>
<label>نام کاربری</label><input id="u">
<label>رمز عبور</label><input id="p" type="password">
<button id="loginBtn" class="primary" style="width:100%;margin-top:18px">ورود</button>
<div id="err" class="err"></div>
<p class="muted" style="font-size:12px;margin-top:18px"><a href="./index.html" style="color:#fff">← بازگشت به سایت</a></p>
</section>

<div id="app" class="hidden wrap">
<header class="top"><div><div class="logo" id="filmTitle"></div><div class="muted" id="filmCode"></div></div><div><span class="badge"><i class="dot"></i><span id="filmStatus"></span></span> <button id="logout" class="ghost">خروج</button></div></header>
<div class="layout"><aside><nav id="nav" class="nav">
<button class="active" data-v="live">روند زنده ایجنت</button>
<button data-v="audit">ممیزی پخش قبلی</button>
<button data-v="strategy">استراتژی پخش</button>
<button data-v="analysis">نقاط قوت و ضعف</button>
<button data-v="chat">گفت‌وگو با ایجنت</button>
</nav></aside><main id="content"></main></div>
</div>

<script>
const USERS={
 "sudden.director":{pass:"SR-ICN-2026!",film:"sudden"},
 "battle.director":{pass:"BOS-ICN-2026!",film:"battle"}
};
const DATA={
 sudden:{
  title:"ناگهان برمی‌خیزد",en:"Sudden Rise",code:"FILM-SR-001",status:"بازمعماری کامل پخش",
  agent:{mission:"بازطراحی معماری پخش از صفر و بازیابی کامل تاریخچه",working:"ممیزی ۶۷ ثبت FilmFreeway + ثبت‌های مستقیم + Premiere Audit",last:"سه انتخاب قطعی شناخته‌شده: Yalda، World Film Festival Kolkata و IFFJK.",risk:"نمایش IFFJK یا Kolkata قبل از ممیزی Premiere می‌تواند بعضی فرصت‌ها را محدود کند.",next:"تقسیم جشنواره‌ها به قابل احیا / سوخته / نیازمند استعلام / در انتظار"},
  strengths:["هویت روایی و تماتیک روشن","مدت ۱۶:۵۰ مناسب بسیاری از رقابت‌های فیلم کوتاه","سه انتخاب قطعی و چند مسیر waiver/free","حجم داده تاریخی کافی برای تصمیم‌گیری ضدتکرار"],
  weaknesses:["ثبت‌های مستقیم خارج FilmFreeway هنوز کامل تجمیع نشده","چند ثبت قبلی در دسته‌بندی نامتناسب انجام شده","Premiere Audit هند هنوز باز است","سال تولید ۲۰۲۵ بخشی از فراخوان‌های آینده را محدود می‌کند"],
  errors:[
   ["ثبت در دسته‌بندی نامتناسب","فشار deadline، فرم‌های متفاوت و تفاوت نام بخش‌ها می‌تواند خطای اپراتوری بسازد.","Eligibility + Category Guard"],
   ["پراکندگی تاریخچه","اطلاعات بین FilmFreeway، ایمیل و ثبت مستقیم پخش شده.","رجیستری واحد + Decision Memory"],
   ["ریسک پیشنهاد تکراری","بدون منبع حقیقت واحد، فرصت قبلی ممکن است دوباره تازه دیده شود.","Duplicate Guard"],
   ["ابهام Premiere","اثر هر نمایش روی جشنواره‌های بعدی متفاوت است.","Premiere Guard"]
  ],
  strategy:["ادغام ۶۷ ثبت FilmFreeway + ثبت‌های مستقیم + outreach جدید","Premiere Audit فوری برای IFFJK و Kolkata","تمرکز A/A+ و Oscar/BAFTA/EFA با waiver/free first","مسدودکردن C/D و مسیرهای تکراری","نسخه جدید واقعی ۲۰۲۶ فقط با تغییر هنری معنادار و استعلام eligibility"]
 },
 battle:{
  title:"نبرد سایه‌ها",en:"Battle of the Shadows",code:"FILM-BOS-002",status:"ممیزی پخش قبلی + قفل هویت",
  agent:{mission:"بازیابی گزارش پخش اولیه و بازسازی کامل Film Identity",working:"Distribution Forensics + Full-film Narrative Pass",last:"دو حضور رقابتی قطعی: 79th Salerno Film Festival و 10th Poppy Jasper International Film Festival.",risk:"هر ارسال تازه قبل از تکمیل history می‌تواند تکراری یا از نظر Premiere مخرب باشد.",next:"استخراج submission / selection / rejection / screening / premiere / distributor history"},
  strengths:["حداقل دو حضور رقابتی بین‌المللی قطعی","امکان بازسازی مسیر پخش با معماری داده‌محور","سابقه جشنواره‌ای موجود برای شروع ممیزی"],
  weaknesses:["گزارش کامل پخش‌کننده قبلی هنوز بازیابی نشده","سال، مدت، ژانر و Premiere هنوز قفل نشده","تحلیل روایی قبلی از مشاهده ناقص بوده"],
  errors:[
   ["نتیجه‌گیری زودهنگام از فیلم","مشاهده ناقص می‌تواند داستان و positioning را منحرف کند.","Full-film pass + Scene-by-scene map"],
   ["ناقص بودن گزارش پخش قبلی","وقتی اسناد در یک پرونده واحد جمع نشوند مسیر واقعی روشن نمی‌ماند.","Distribution Forensics + Evidence Registry"],
   ["ریسک ارسال تکراری","بدون history کامل، جشنواره قبلی ممکن است دوباره هدف قرار گیرد.","Duplicate Guard"]
  ],
  strategy:["بازیابی فوری گزارش پخش قبلی","ثبت Salerno 79th و Poppy Jasper 10th به‌عنوان نقطه شروع","Full-film Narrative Pass + Film Identity Lock","عدم ارسال تازه تا تکمیل history","سپس کمپین A/A+ با waiver/free first و Premiere Guard"]
 }
};
let film=null,view="live";
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const ul=xs=>`<ul>${xs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
function render(){
 const F=DATA[film];
 filmTitle.textContent=`${F.title} — ${F.en}`;filmCode.textContent=F.code;filmStatus.textContent=F.status;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===view));
 if(view==="live")content.innerHTML=`<div class="card"><h2>روند زنده ایجنت</h2><div class="feed"><div class="feeditem"><small>مأموریت فعال</small><b>${esc(F.agent.mission)}</b></div><div class="feeditem"><small>الان مشغول</small><b>${esc(F.agent.working)}</b></div><div class="feeditem"><small>آخرین یافته</small><b>${esc(F.agent.last)}</b></div><div class="feeditem"><small>ریسک فوری</small><b>${esc(F.agent.risk)}</b></div><div class="feeditem"><small>اقدام بعدی</small><b>${esc(F.agent.next)}</b></div></div></div>`;
 if(view==="audit")content.innerHTML=`<div class="card"><h2>ممیزی پخش قبلی</h2><p class="muted">هدف این بخش سرزنش افراد نیست؛ خطاهای انسانی باید به کنترل سیستمی تبدیل شوند.</p>${F.errors.map(x=>`<div class="errorcard"><h3>${esc(x[0])}</h3><small>چرا رخ می‌دهد؟</small><p>${esc(x[1])}</p><small>راهکار سیستم</small><p>${esc(x[2])}</p></div>`).join("")}</div>`;
 if(view==="strategy")content.innerHTML=`<div class="card"><h2>استراتژی پخش و دلیل انتخاب</h2>${ul(F.strategy)}</div>`;
 if(view==="analysis")content.innerHTML=`<div class="two"><div class="card"><h2>نقاط قوت</h2>${ul(F.strengths)}</div><div class="card"><h2>نقاط ضعف و ریسک‌ها</h2>${ul(F.weaknesses)}</div></div>`;
 if(view==="chat")content.innerHTML=`<div class="card"><h2>گفت‌وگو با ایجنت</h2><div class="chatbox" id="chatbox"><div class="msg agent">این نسخه روی GitHub Pages است؛ چت زنده OpenAI هنوز روی این میزبان اجرا نمی‌شود. پنل و پرونده فیلم کامل فعال است.</div></div><div class="chatrow"><textarea id="chatInput" rows="2" placeholder="پیام آزمایشی..."></textarea><button id="sendChat" class="primary">ارسال</button></div><div class="notice">برای چت واقعی، همین پنل باید روی backend امن Vercel/Node اجرا شود. این نسخه عمداً پاسخ جعلی تولید نمی‌کند.</div></div>`;
 if(view==="chat")sendChat.onclick=()=>{const m=chatInput.value.trim();if(!m)return;chatbox.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(m)}</div><div class="msg agent">پیام ثبت شد. اتصال واقعی ایجنت به backend نیاز دارد و روی GitHub Pages قابل اجرا نیست.</div>`);chatInput.value="";chatbox.scrollTop=chatbox.scrollHeight}
}
function login(){const x=USERS[u.value.trim()];if(!x||x.pass!==p.value){err.textContent="نام کاربری یا رمز نادرست است.";return}film=x.film;loginBox.classList.add("hidden");app.classList.remove("hidden");render()}
loginBtn.onclick=login;p.onkeydown=e=>{if(e.key==="Enter")login()};logout.onclick=()=>location.reload();nav.onclick=e=>{const b=e.target.closest("button[data-v]");if(b){view=b.dataset.v;render()}};
</script>
</body></html>
