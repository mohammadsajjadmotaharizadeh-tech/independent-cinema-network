<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICN — پنل کارگردان</title>
<style>
:root{--bg:#080d16;--panel:#101827;--line:#24314a;--text:#eef4ff;--muted:#8fa0bc;--ok:#35d486}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172449 0,#080d16 40%);color:var(--text);font-family:Tahoma,Arial,sans-serif}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px}
.login{max-width:460px;margin:8vh auto;padding:28px;background:#101827;border:1px solid var(--line);border-radius:24px}.logo{font-size:22px;font-weight:900}.muted{color:var(--muted);line-height:1.9}
label{display:block;margin:15px 0 7px;font-size:13px;color:#c0c9da}input,textarea{width:100%;padding:13px;background:#0a1220;color:#fff;border:1px solid var(--line);border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#08101e}.ghost{background:#18243a;color:#e4ecfa;border:1px solid #2c3b59}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.badge{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:99px;background:#10271d;color:#94efbd;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;margin-top:18px}aside{background:#101827;border:1px solid var(--line);border-radius:20px;padding:14px;height:max-content}.nav button{width:100%;display:block;text-align:right;background:transparent;color:#bbc7da;border:0;padding:11px;border-radius:11px;margin:4px 0}.nav button.active{background:#1b2942;color:#fff}
.card{background:#101827;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}h1,h2,h3{margin-top:0}p,li{line-height:1.95}.feed{display:grid;gap:9px}.feeditem{background:#111c2e;border:1px solid #22314c;border-radius:14px;padding:12px}.feeditem small{display:block;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.errorcard{padding:14px;border:1px solid #33415d;border-radius:14px;margin:9px 0;background:#0d1625}.errorcard small{color:#92a1b9}
.chatbox{height:360px;overflow:auto;background:#09111e;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}.msg{max-width:84%;padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.8}.me{background:#263757;margin-right:auto}.agent{background:#15251f;border:1px solid #214c37}.chatrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.notice{padding:11px;border:1px dashed #35445f;border-radius:12px;color:#9ba9be;font-size:12px;margin-top:10px}.err{color:#ff8d8d;margin-top:10px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style></head>
<body>
<section id="loginBox" class="login"><div class="logo">ICN — ورود کارگردان</div><p class="muted">هر حساب فقط پرونده فیلم خودش را می‌بیند.</p><label>نام کاربری</label><input id="u"><label>رمز عبور</label><input id="p" type="password"><button id="loginBtn" class="btn primary" style="width:100%;margin-top:18px">ورود</button><div id="err" class="err"></div><p class="muted" style="font-size:12px;margin-top:18px"><a href="index.html">← بازگشت به سایت</a></p></section>
<div id="app" class="hidden wrap"><header class="top"><div><div class="logo" id="filmTitle"></div><div class="muted" id="filmCode"></div></div><div><span class="badge"><i class="dot"></i><span id="filmStatus"></span></span> <button id="logout" class="btn ghost">خروج</button></div></header>
<div class="layout"><aside><nav id="nav" class="nav"><button class="active" data-v="live">روند زنده ایجنت</button><button data-v="audit">ممیزی پخش قبلی</button><button data-v="strategy">استراتژی پخش</button><button data-v="analysis">نقاط قوت و ضعف</button><button data-v="chat">گفت‌وگو با ایجنت</button></nav></aside><main id="content"></main></div></div>
<script>
let token=sessionStorage.getItem("icnToken"),F=null,view="live",history=[];
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const ul=xs=>`<ul>${xs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
async function state(){const r=await fetch("/api/state",{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw 0;F=await r.json();filmTitle.textContent=`${F.title_fa} — ${F.title_en}`;filmCode.textContent=F.film_code;filmStatus.textContent=F.status;render()}
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===view));
if(view==="live")content.innerHTML=`<div class="card"><h2>روند زنده ایجنت</h2><div class="feed"><div class="feeditem"><small>مأموریت فعال</small><b>${esc(F.agent.mission)}</b></div><div class="feeditem"><small>الان مشغول</small><b>${esc(F.agent.working)}</b></div><div class="feeditem"><small>آخرین یافته تأییدشده</small><b>${esc(F.agent.last_verified)}</b></div><div class="feeditem"><small>ریسک فوری</small><b>${esc(F.agent.risk)}</b></div><div class="feeditem"><small>اقدام بعدی</small><b>${esc(F.agent.next)}</b></div></div></div>`;
if(view==="audit")content.innerHTML=`<div class="card"><h2>ممیزی پخش قبلی</h2><p class="muted">این بخش برای سرزنش افراد نیست؛ هدف تبدیل خطاهای انسانی قابل وقوع به کنترل‌های سیستمی است.</p>${F.past_errors.map(x=>`<div class="errorcard"><h3>${esc(x.title)}</h3><small>چرا رخ می‌دهد؟</small><p>${esc(x.why)}</p><small>راهکار سیستم</small><p>${esc(x.fix)}</p></div>`).join("")}</div>`;
if(view==="strategy")content.innerHTML=`<div class="card"><h2>استراتژی پخش و دلیل انتخاب آن</h2>${ul(F.strategy)}</div>`;
if(view==="analysis")content.innerHTML=`<div class="two"><div class="card"><h2>نقاط قوت</h2>${ul(F.strengths)}</div><div class="card"><h2>نقاط ضعف و ریسک‌ها</h2>${ul(F.weaknesses)}</div></div>`;
if(view==="chat"){content.innerHTML=`<div class="card"><h2>گفت‌وگو مستقیم با ایجنت فیلم</h2><div id="chatbox" class="chatbox"><div class="msg agent">سلام. من ایجنت اختصاصی همین پرونده هستم.</div></div><div class="chatrow"><textarea id="chatInput" rows="2" placeholder="پیام به ایجنت..."></textarea><button class="btn primary" id="sendChat">ارسال</button></div><div class="notice">پاسخ از backend امن دریافت می‌شود؛ کلید مدل داخل مرورگر قرار نمی‌گیرد.</div></div>`;sendChat.onclick=send}}
async function send(){const m=chatInput.value.trim();if(!m)return;chatbox.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(m)}</div>`);chatInput.value="";const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({message:m,history})});if(!r.ok){chatbox.insertAdjacentHTML("beforeend",`<div class="msg agent">اتصال ایجنت روی سرور هنوز تنظیم نشده یا خطا دارد.</div>`);return}const j=await r.json();chatbox.insertAdjacentHTML("beforeend",`<div class="msg agent">${esc(j.reply)}</div>`);history.push({role:"user",content:m},{role:"assistant",content:j.reply});history=history.slice(-12);chatbox.scrollTop=chatbox.scrollHeight}
async function login(){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value.trim(),password:p.value})});if(!r.ok){err.textContent="نام کاربری یا رمز نادرست است.";return}const j=await r.json();token=j.token;sessionStorage.setItem("icnToken",token);loginBox.classList.add("hidden");app.classList.remove("hidden");state()}
loginBtn.onclick=login;p.onkeydown=e=>{if(e.key==="Enter")login()};logout.onclick=()=>{sessionStorage.clear();location.reload()};nav.onclick=e=>{const b=e.target.closest("button[data-v]");if(b){view=b.dataset.v;render()}};
if(token){loginBox.classList.add("hidden");app.classList.remove("hidden");state().catch(()=>{sessionStorage.clear();location.reload()})}
</script></body></html>
