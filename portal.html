<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICN — پنل فیلم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d17;color:#eff4ff;font-family:Tahoma,Arial,sans-serif;line-height:1.9}button,textarea{font:inherit}.hidden{display:none!important}.wrap{width:min(1220px,94%);margin:auto;padding:20px 0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid #202d45;padding:8px 0 18px}.brand{font-weight:900;font-size:20px}.muted{color:#8e9db8}.badge{display:inline-flex;gap:7px;align-items:center;background:#10271e;color:#99edc0;border:1px solid #1f5138;border-radius:999px;padding:7px 10px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#3ed58d}.btn{border:1px solid #293650;background:#17233a;color:white;border-radius:11px;padding:10px 13px;cursor:pointer}.layout{display:grid;grid-template-columns:270px 1fr;gap:16px;margin-top:17px}aside{background:#0f1828;border:1px solid #22304a;border-radius:19px;padding:13px;height:max-content;position:sticky;top:12px}nav button{display:block;width:100%;text-align:right;border:0;background:transparent;color:#aebbd0;padding:10px;border-radius:10px;margin:3px 0;cursor:pointer}nav button.active{background:#1b2942;color:#fff}.card{background:linear-gradient(180deg,#101a2b,#0d1523);border:1px solid #22304a;border-radius:19px;padding:19px;margin-bottom:13px}h1,h2,h3{margin-top:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border:1px solid #263550;background:#111c2e;border-radius:14px}.stat small{display:block;color:#7f8fa9}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}ul{margin:0;padding-right:20px}li{margin:5px 0}.feed{display:grid;gap:8px}.feed div{padding:11px;border-radius:12px;background:#111b2d;border:1px solid #22304a}.feed small{display:block;color:#7f8da6}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px;border-bottom:1px solid #233049;text-align:right;vertical-align:top}th{color:#7f8da8}.tag{display:inline-block;padding:4px 7px;border-radius:8px;background:#1f4d33;color:#99edc0}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}.film-card{position:relative;min-height:430px;overflow:hidden;border-radius:26px;border:1px solid rgba(255,255,255,.09);background:#0c1321}.film-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.52;filter:saturate(.7)}.film-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#090e19 8%,rgba(9,14,25,.45) 70%,rgba(9,14,25,.25))}.film-content{position:absolute;z-index:2;inset:auto 22px 22px 22px}.film-status{display:inline-flex;align-items:center;gap:7px;color:#99efc0;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#3dd78e;box-shadow:0 0 12px rgba(61,215,142,.7)}.film-content h3{font-size:31px;margin:8px 0 0}.film-content small{color:#8997b1}.film-content p{color:#b0bbcf}.specs{display:flex;gap:7px;flex-wrap:wrap}.specs span{font-size:11x;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.08)}
@media(max-width:900px){.navlinks{display:none}.grid3{grid-template-columns:1fr 1fr}.films,.problem,.founder{grid-template-columns:1fr}.law-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid3,.law-grid{grid-template-columns:1fr}.slide{grid-template-columns:1fr;padding:25px}.slide-no{font-size:38px}h1{font-size:44px}}
</style></head>
<body><div class="wrap"><header class="top"><div><div class="brand" id="title"></div><div class="muted" id="code"></div></div><div><span class="badge"><i class="dot"></i><span id="status"></span></span> <button class="btn" onclick="sessionStorage.clear();location.href='index.html'">خروج</button></div></header><div class="layout"><aside><nav id="nav">
<button class="active" data-v="overview">نمای کلی</button><button data-v="profile">پرونده فیلم</button><button data-v="live">عملیات زنده ایجنت</button><button data-v="audit">ممیزی پخش قبلی</button><button data-v="festivals">جشنواره‌ها</button><button data-v="strategy">استراتژی پخش</button><button data-v="analysis">نقاط قوت و ضعف</button><button data-v="decisions">حافظه تصمیم</button><button data-v="guard">نگهبان حیثیت</button><button data-v="chat">گفت‌وگو با ایجنت</button><button data-v="festival-history">تاریخچه جشنواره</button><button data-v="eligibility">موتور eligibility</button><button data-v="forensics">تحلیل{forensics}</button><button data-v="premiere">نقش\toPremiere</button><button data-v="category">خطاهای\s Categoría</button></nav></aside><main id="content"></main></div></div>
<script>
const DATA={"sudden": {"title": "ناگهان برمی‌خیزد", "en": "Sudden Rise", "code": "FILM-SR-001", "username": "sudden.director", "password": "SR-ICN-2026!", "status": "بازمعماری کامل پخش", "year": "۲۰۲۵", "runtime": "۱۶:۵۰", "country": "ایران", "language": "فارسی / زیرنویس انگلیسی", "aspect": "۴:۳", "genre": "رئالیسم جادویی / درام / طنز سیاه ظریف", "logline": "در روستایی دورافتاده که رونقش زمانی به زائران یک سنگ مقدس وابسته بود، مردی درون سنگ gotten", "agent": {"mission": "بازطراحی معماری پخش از صفر؛ نه ادامه مکانیکی مسیر قبلی.", "working": "ممیزی ۶۷ ثبت FilmFreeway + بازیابی ثبت‌های مستقیم + Premiere Audit + Opportunity Recovery", "last": "سه انتخاب قطعی gegründete: Yalda، World Film Festival Kolkata و IFFJK. Brussels و RIIFF نیز ثبت و در انتظار نتیجه‌اند.", "risk": "تأیید نمایش IFFJK یا Kolkata قبل از ممیزی Premiere ممکن است بخشی از فرصت‌های حساس‌تر را محدود کند.", "next": "ساخت رجیستری واحد و تقسیم تمام مسیرها به قابل احیا / سوخته / نیازمند استعلام / در انتظار."}, "stats": [["ثبت FilmFreeway", "۶۷"], ["انتخاب قطعی", "۳"], ["Not Selected ثبت‌شده", "۲۸"], ["وضعیت", "بازمعماری"]], "strengths": ["هویت روایی و تماتیک مشخص؛ ایمان، اقتصاد، اخلاق جمعی و ارزش جان انسان.", "مدت ۱۶:۵۰ برای بخش مهمی از رقابت‌های فیلم کوتاه قابل مدیریت است.", "سه انتخاب قطعی و چند مسیر waiver/free فعال.", "داده تاریخی زیاد برای ساخت موتور נגדتکرار و حافظه تصمیم واقعی."], "weaknesses": ["تاریخچه ثبت‌های مستقیم خارج FilmFreeway هنوز کامل تجمیع نشده است.", "چند ثبت قبلی در دسته‌بندی نامتناسب انجام شده؛ در نتیجه «رد هنری در دسته درست» برای آن‌ها اثبات نشده.", "Premiere Audit برای نمایش‌های هند باز است.", "سال تولید ۲۰۲۵ بخشی از فراخوان‌های بعدی را محدود می‌کند."], "errors": [["Aspen → Animation", "فیلم لایو اکشن در دسته Animation registrado.", "تطبیق خودکار نوع فیلم و category قبل از ثبت."], ["Golden Apricot → بخش Armenia-limited", "بخش انتخاب‌شده با شرایط فیلم ایرانی همخوان نبود.", "Eligibility Gate بر اساس..."]], const esc=s=>((s??"").toString().replace(/[&<>"']/g,m=>({"&":"&","<":"<",">":">",'"':""","'":"&#039;"}[m]));const F=DATA.sudden;let token=sessionStorage.getItem("icnToken"),film=null,view="live",history=[];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle("active",b.dataset.v===view));const list=xs=>`<ul>${xs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle("active",b.dataset.v===view));if(view==="overview")content.innerHTML=`<div class="card"><h1>${esc(F.title)}</h1><p class="muted">${esc(F.logline)}</p></div><div class="stats">${F.stats.map(x=>`<div class="stat"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join("")}</div><div class="card" style="margin-top:12px"><h2>اقدام بعدی ایجنت</h2><p>${esc(F.agent.next)}</p></div>`;if(view==="profile")content.innerHTML=`<div class="card"><h2>پرونده فیلم</h2><table><tr><th>عنوان</th><td>${esc(F.title)} / ${esc(F.en)}</td></tr><tr><th>کشور</th><td>${esc(F.country)}</td></tr><tr><th>سال</th><td>${esc(F.year)}</td></tr><tr><th>مدت</th><td>${esc(F.runtime)}</td></tr><tr><th>زبان</th><td>${esc(F.language)}</td></tr><tr><th>نسبت تصویر</th><td>${esc(F.aspect)}</td></tr><tr><th>ژانر</th><td>${esc(F.genre)}</td></tr></table>`;if(view==="live")content.innerHTML=`<div class="card"><h2>عملیات زنده ایجنت</h2><div class="feed"><div><small>مأموریت</small><b>${esc(F.agent.mission)}</b></div><div><small>الان مشغول</small><b>${esc(F.agent.working)}</b></div><div><small>آخرین یافته تأییدشده</small><b>${esc(F.agent.last)}</b></div><div><small>ریسک فوری</small><b>${esc(F.agent.risk)}</b></div><div><small>اقدام بعدی</small><b>${esc(F.agent.next)}</b></div></div></div>`;if(view==="audit")content.innerHTML=`<div class="card"><h2>ممیزی پخش قبلی</h2><p class="muted">هدف، سرزنش انسان نیست؛ هدف تبدیل خطاهای قابل‌وقوع به کنترل سیستمی است.</p>${F.errors.map(x=>`<div class="error"><h3>${esc(x[0])}</h3><small>مسئله</small><p>${esc(x[1])}</p><small>کنترل پیشنهادی</small><p>${esc(x[2])}</p></div>`).join("")}<h3>چرا خطای انسانی رخ می‌دهد؟</h3>${ul(F.why_human)}</div>`;if(view==="festivals")content.innerHTML=`<div class="card"><h2>وضعیت جشنواره‌ها</h2><table><tr><th>جشنواره</th><th>وضعیت</th><th>یادداشت</th></tr>${F.festivals.map(x=>`<tr><td>${esc(x[0])}</td><td><span class="tag">${esc(x[1])}</span></td><td>${esc(x[2])}</td></tr>`).join("")}</table>`;if(view==="strategy")content.innerHTML=`<div class="card"><h2>استراتژی پخش و دلیل انتخاب</h2>${ul(F.strategy)}</div>`;if(view==="analysis")content.innerHTML=`<div class="two"><div class="card"><h2>نقاط قوت</h2>${ul(F.strengths)}</div><div class="card"><h2>نقاط ضعف و ریسک‌ها</h2>${ul(F.weaknesses)}</div></div>`;if(view==="decisions")content.innerHTML=`<div class="card"><h2>حافظه تصمیم</h2><p>هر تصمیم باید با <b>نتیجه + دلیل + تاریخ + منبع + شرط بازگشایی</b> ثبت شود.</p><div class="feed"><div><small>قانون</small><b>Unknown ≠ No</b></div><div><small>منبع حقیقت</small><b>رجیستری ساختاریافته، نه حافظه چت</b></div><div><small>اصل AgainstDuplicate</small><b>Search بدون History Check به Action نمی‌رسد.</b></div></div>`;if(view==="guard")content.innerHTML=`<div class="card"><h2>نگهبان حیثیت حرفه‌ای</h2><p>قبل از هر تماس یا ثبت جدید:</p><ol><li>هویت فیلم</li><li>هویت جشنواره و دوره</li><li>تاریخچه تماس/ثبت</li><li>Eligibility</li><li>Duplicate Check</li><li>Premiere / Rights / Budget Risk</li><li>قفل نهایی</li></ol>`;if(view==="festival-history")content.innerHTML=`<div class="card"><h2>تاریخچه جشنواره‌ها</h2>${renderFestivalHistory()}</div>`;if(view==="eligibility")content.innerHTML=`<div class="card"><h2>موتور eligibility</h2>${renderEligibilityEngine()}</div>`;if(view==="forensics")content.innerHTML=`<div class="card"><h2>تحلیل{forensics}</h2>${renderDistributionForensics()}</div>`;if(view==="premiere")content.innerHTML=`<div class="card"><h2>نقش{maxlength=50}Premiere{/maxlength}</h2>${renderPremiereMap()}</div>`;if(view==="category")content.innerHTML=`<div class="card"><h2>خطاهای\s Categoría</h2>${renderCategoryErrors()}</div>`;}function renderFestivalHistory(){const registry=require("./festival-registry");const records=registry.getFestivalRecords("sudden")||[];const form=`<div class="card" style="margin-top:15px"><h3>ثبت nuovoHistoria جشنواره</h3><form onsubmit="submitFestivalRecord(event)"><label>نام جشنواره</label><input type="text" name="festivalName" required><label>اد/سال</label><input type="text" name="edition" required><label>بخش/سایڈ</label><input type="text" name="section" required><label>روش ثبت</label><input type="text" name="submissionMethod" required><label>مآ outcome</label><input type="text" name="result" required><label>نمایش/خروجی</label><input type="checkbox" name="screened" id="screened"><label for="screened">بله</label><input type="hidden" name="screenedValue" value="physical"><small>*(انتخاب فیزیکی默认)</small><button type="submit" class="btn primary" style="margin-top:8px">ثبت</button></form></div>`;return`<p>${records.length} record(s) found.</p>${form}`;}function renderEligibilityEngine(){const film=getFilm("sudden");if(!film)return"<p>Film not found</p>";const recs=require("./festival-registry").getFestivalRecords("sudden")||[];return`<p>Film: ${esc(film.title)} (${esc(film.year)})</p><p>Records: ${recs.length}</p><button class="btn primary" id="evaluateEligibility">ارزیابی eligibility</button><div id="eligibilityResult" style="margin-top:15px;"></div>`;}window.evalEligibility=()=>{const result=require("./eligibility-engine").evaluateEligibility("sudden",{festivalName:"Yalda Short Film Festival",edition:"2025",section:"Short Film",result:"Selected",screening:"physical"});const elResult=document.getElementById("eligibilityResult");elResult.innerHTML=`<p><b>Status:</b> ${result.status}</p><p><b>Reasons:</b>${list(result.reasons.map(r=>`<span class='muted'>• ${esc(r)}</span>`))}</p><p><b>Missing Data:</b>${list(result.missingData.map(m=>`<span class='muted'>• ${esc(m)}</span>`))}</p><p><b>Risk Level:</b> ${result.riskLevel}</p><p><b>Recommended Next Action:</b> ${result.recommendedNextAction}</p><p><b>Category Error:</b> ${result.categoryError? "Yes": "No"}</p><p><b>Premiere Risk:</b> ${result.premiereRisk? "Yes": "No"}</p><p><b>Duplicate:</b> ${result.duplicate? "Yes": "No"}</p><p><b>Hold:</b> ${result.hold? "Yes": "No"}</p>`;};window.submitFestivalRecord=()=>{const form=document.querySelector('form[onsubmit]');const data={festivalName:form.festivalName.value,edition:form.edition.value,section:form.section.value,submissionMethod:form.submissionMethod.value,result:form.result.value,screened:form.screened.checked};const result=require("./festival-registry").addFestivalRecord("sudden",data);const msg=document.createElement('div');msg.style.marginTop="10px";msg.style.color="#bff";msg.textContent=result.type==="ADDED"?"✓ Registered":"⚠ "+result.message;form.reset();document.querySelector('.card:last-child').prepend(msg);};function renderDistributionForensics(){const fs=require("./distribution-forensics").getFilmForensics("sudden");return`<p>Forensic records: ${fs.length}</p>${list(fs.map(r=>`<div><b>${esc(r.festivalName)}</b> ${esc(r.edition)} - ${esc(r.result)} - ${esc(r.confidence)} ${r.sourceDocuments.length?`docs:`:``}</div>`))}`;}function renderPremiereMap(){const mappings=require("./premiere-map").getAllPremiereMappings("sudden");return`<p>Premiere mappings: ${mappings.length}</p>${list(mappings.map(m=>`<div><b>${m.premiereType}</b>: ${esc.m(m.festivalName)} ${esc.m(m.edition)} - screened: ${m.screened}</div>`))}`;}function renderCategoryErrors(){const mismatches=require("./category-detection").batchDetectMismatches();return`<p>Total mismatches: ${mismatches.length}</p>${list(mismatches.map(m=>`<div><b>${m.filmTitle}</b> @ ${m.festivalName}: ${m.details}</div>`))}`;}nav.onclick=e=>{const b=e.target.closest('button[data-v]');if(b){view=b.dataset.v;render()}};
</script></body></html>
