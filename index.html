<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICN — پنل کارگردان</title>
<style>
:root{--bg:#090d17;--panel:#101726;--line:#24314a;--text:#edf2ff;--muted:#8fa0bc;--ok:#31d17c;--warn:#ffbe55}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172448 0,#090d17 38%);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.hidden{display:none!important}
.login{max-width:460px;margin:9vh auto;padding:28px;border:1px solid var(--line);background:#101726;border-radius:24px}.logo{font-weight:900;font-size:21px}.sub{color:var(--muted);line-height:1.9}label{display:block;margin:16px 0 7px;color:#b8c4da;font-size:13px}
input,textarea{width:100%;padding:13px 14px;background:#0b1220;color:#fff;border:1px solid var(--line);border-radius:12px;outline:none}button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#0b1020}.ghost{background:#18243a;color:#dce6fb;border:1px solid #2c3b59}.err{color:#ff8b8b;margin-top:12px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:99px;background:#10271d;color:#90f0b8;font-size:12px}.dot{width:8px;height:8px;background:var(--ok);border-radius:50%}
.grid{display:grid;grid-template-columns:260px 1fr;gap:18px;margin-top:18px}aside{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;height:max-content}.nav button{display:block;width:100%;text-align:right;margin:6px 0;background:transparent;color:#bdc9dc}.nav button.active{background:#1a2740;color:#fff}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}h1,h2,h3{margin-top:0}p,li{line-height:1.95}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chatbox{height:360px;overflow:auto;padding:10px;background:#0b1220;border:1px solid var(--line);border-radius:16px;margin-bottom:12px}.msg{max-width:82%;padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.8}.me{background:#263756;margin-right:auto}.agent{background:#15261f;border:1px solid #234b37}.chatrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.feed{display:grid;gap:9px}.feeditem{padding:12px 14px;background:#111b2d;border:1px solid #22304a;border-radius:14px}.feeditem small{display:block;color:var(--muted);margin-bottom:5px}.notice{font-size:12px;color:#9ba8bc;padding:10px;border:1px dashed #34415b;border-radius:12px;margin-top:10px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style></head>
<body>
<section id="loginBox" class="login"><div class="logo">ICN — شبکه سینمای مستقل</div><p class="sub">ورود امن کارگردان</p><label>نام کاربری</label><input id="u"><label>رمز عبور</label><input id="p" type="password"><button id="loginBtn" class="primary" style="width:100%;margin-top:18px">ورود</button><div id="err" class="err"></div></section>
<div id="app" class="hidden wrap"><header class="top"><div><div class="logo">پنل اختصاصی فیلم</div><div class="sub" id="title"></div></div><div><span class="badge"><i class="dot"></i><span id="status"></span></span> <button id="logout" class="ghost">خروج</button></div></header>
<div class="grid"><aside><div class="sub" id="code"></div><nav id="nav" class="nav"><button class="active" data-v="live">روند زنده ایجنت</button><button data-v="audit">ممیزی پخش قبلی</button><button data-v="strategy">استراتژی پخش</button><button data-v="analysis">نقاط قوت و ضعف</button><button data-v="chat">گفت‌وگو با ایجنت</button></nav></aside><main id="content"></main></div></div>
<script>
let token=sessionStorage.getItem("icnToken"),film=null,view="live",F=null,history=[];
const e=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const list=xs=>`<ul>${xs.map(x=>`<li>${e(x)}</li>`).join("")}</ul>`;
async function loadState(){const r=await fetch("/api/state",{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw 0;F=await r.json();title.textContent=`${F.title} — ${F.en}`;status.textContent=F.status;code.textContent=F.code;render()}
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===view));
if(view==="live")content.innerHTML=`<div class="card"><h2>روند زنده ایجنت</h2><div class="feed"><div class="feeditem"><small>مأموریت</small><b>${e(F.agent.mission)}</b></div><div class="feeditem"><small>الان مشغول</small><b>${e(F.agent.working)}</b></div><div class="feeditem"><small>آخرین یافته</small><b>${e(F.agent.last)}</b></div><div class="feeditem"><small>ریسک</small><b>${e(F.agent.risk)}</b></div><div class="feeditem"><small>اقدام بعدی</small><b>${e(F.agent.next)}</b></div></div></div>`;
if(view==="audit")content.innerHTML=`<div class="card"><h2>ممیزی پخش قبلی</h2><h3>آسیب‌پذیری‌ها</h3>${list(F.weaknesses)}<h3>چرا این خطاها انسانی رخ می‌دهند؟</h3>${list(F.human_errors)}</div>`;
if(view==="strategy")content.innerHTML=`<div class="card"><h2>استراتژی پخش و دلایل آن</h2>${list(F.strategy)}</div>`;
if(view==="analysis")content.innerHTML=`<div class="two"><div class="card"><h2>نقاط قوت</h2>${list(F.strengths)}</div><div class="card"><h2>نقاط ضعف</h2>${list(F.weaknesses)}</div></div>`;
if(view==="chat"){content.innerHTML=`<div class="card"><h2>گفت‌وگو مستقیم با ایجنت</h2><div id="chatbox" class="chatbox"><div class="msg agent">سلام. من ایجنت اختصاصی این فیلم هستم.</div></div><div class="chatrow"><textarea id="chatInput" rows="2" placeholder="پیام..."></textarea><button id="sendChat" class="primary">ارسال</button></div></div>`;sendChat.onclick=send;}
}
async function send(){const m=chatInput.value.trim();if(!m)return;chatbox.insertAdjacentHTML("beforeend",`<div class="msg me">${e(m)}</div>`);chatInput.value="";const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({message:m,history})});if(!r.ok){chatbox.insertAdjacentHTML("beforeend",`<div class="msg agent">خطای اتصال. تنظیمات سرور را بررسی کنید.</div>`);return}const j=await r.json();chatbox.insertAdjacentHTML("beforeend",`<div class="msg agent">${e(j.reply)}</div>`);history.push({role:"user",content:m},{role:"assistant",content:j.reply});history=history.slice(-12);chatbox.scrollTop=chatbox.scrollHeight}
async function doLogin(){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value.trim(),password:p.value})});if(!r.ok){err.textContent="نام کاربری یا رمز نادرست است.";return}const j=await r.json();token=j.token;sessionStorage.setItem("icnToken",token);loginBox.classList.add("hidden");app.classList.remove("hidden");loadState()}
loginBtn.onclick=doLogin;p.onkeydown=x=>{if(x.key==="Enter")doLogin()};logout.onclick=()=>{sessionStorage.clear();location.reload()};nav.onclick=x=>{const b=x.target.closest("button[data-v]");if(b){view=b.dataset.v;render()}};
if(token){loginBox.classList.add("hidden");app.classList.remove("hidden");loadState().catch(()=>{sessionStorage.clear();location.reload()})}
</script></body></html>
