<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>شبکه سینمای مستقل — مدیر هوشمند پخش فیلم</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-wrap">
        <div class="brand">
          <div class="brand-mark">ICN</div>
          <div>
            <strong>شبکه سینمای مستقل</strong>
            <small>مدیر هوشمند پخش و جشنواره</small>
          </div>
        </div>
        <div class="status-chip"><span class="dot online"></span> پایش روزانه فعال</div>
      </div>

      <nav id="nav" class="nav-list">
        <button data-page="home" class="active">خانه</button>
        <button data-page="ourFilms">فیلم‌های ما</button>
        <button data-page="login">ورود فیلمساز</button>
        <button data-page="dashboard" data-protected="true">داشبورد کارگردان</button>
        <button data-page="film" data-protected="true">پرونده فیلم</button>
        <button data-page="festivals" data-protected="true">جشنواره‌ها</button>
        <button data-page="calendar" data-protected="true">تقویم نتایج</button>
        <button data-page="decisions" data-protected="true">حافظه تصمیم</button>
        <button data-page="guard" data-protected="true">نگهبان حیثیت</button>
        <button data-page="settings" data-protected="true">تنظیمات ایجنت</button>
      </nav>

      <div class="sidebar-footer">
        <div class="mini-card">
          <small>نسخه آزمایشی</small>
          <b>مخصوص تست واقعی فیلم</b>
          <p>بدون ارسال تکراری، بدون از دست‌دادن موعدها، با تقویم شمسی و حافظه تصمیم.</p>
        </div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="page-title">خانه</h1>
          <p id="page-subtitle">داشبورد سینمایی، فارسی و هوشمند برای مدیریت پخش فیلم مستقل</p>
        </div>
        <div class="session-panel" id="session-panel"></div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
